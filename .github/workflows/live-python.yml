name: Live - Python

# Runs the live integration tests against a throwaway Couchbase Server 8 container.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'python/**'
      - 'scripts/setup-live-couchbase.sh'
      - 'scripts/smoke-test-python-package.sh'
      - '.github/workflows/live-python.yml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  live:
    name: Live Couchbase ${{ matrix.couchbase-image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        couchbase-image: ['couchbase:enterprise-8.0.3']
      fail-fast: false
    services:
      couchbase:
        image: ${{ matrix.couchbase-image }}
        ports:
          - 8091-8097:8091-8097
          - 11210:11210
    env:
      COUCHBASE_INTEGRATION_TESTS: '1'
      COUCHBASE_CONNECTION_STRING: couchbase://localhost
      COUCHBASE_USERNAME: Administrator
      COUCHBASE_PASSWORD: password
      COUCHBASE_BUCKET: strands_memory
      COUCHBASE_SCOPE: _default
      COUCHBASE_COLLECTION: _default
      COUCHBASE_VECTOR_BACKEND: hyperscale
      COUCHBASE_DISTANCE_METRIC: L2_SQUARED
      # The live tests and examples/smoke_test.py share the 3-dimension index from the setup script.
      EMBEDDING_DIMENSIONS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from python-v* tags.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Initialize Couchbase, bucket, seed documents and vector index
        run: bash ../scripts/setup-live-couchbase.sh
      - run: pip install hatch build
      - name: examples/setup.py accepts the existing index
        run: cp .env.example .env && hatch run python examples/setup.py
      - run: hatch run test -m integration
      - name: Run examples/smoke_test.py from the built wheel
        run: bash ../scripts/smoke-test-python-package.sh
        env:
          COUCHBASE_NAMESPACE: smoke-${{ github.run_id }}
