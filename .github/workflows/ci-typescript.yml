name: CI - TypeScript

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
  push:
    branches: [ main ]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: typescript

jobs:
  test:
    name: Test - Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - name: Install the packed tarball in a clean project
        run: npm run smoke:package

  sdk-compat:
    name: Strands SDK ${{ matrix.sdk-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Lowest and newest versions allowed by the peerDependencies range.
        sdk-version: ['1.13.0', 'latest']
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm install --no-save @strands-agents/sdk@${{ matrix.sdk-version }}
      # Not `npm ls`: it reports 1.13.0 as invalid against the devDependency range.
      - name: Show the installed SDK version
        run: node -p "'@strands-agents/sdk ' + require('./node_modules/@strands-agents/sdk/package.json').version"
      - run: npm run type-check
      - run: npm test
