name: Live - TypeScript

# Runs the live integration tests against a throwaway Couchbase Server 8 container.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'typescript/**'
      - 'scripts/setup-live-couchbase.sh'
      - '.github/workflows/live-typescript.yml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: typescript

jobs:
  live:
    name: Live Couchbase ${{ matrix.couchbase-image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        couchbase-image: ['couchbase:enterprise-8.0.3']
      fail-fast: false
    services:
      couchbase:
        image: ${{ matrix.couchbase-image }}
        ports:
          - 8091-8097:8091-8097
          - 11210:11210
    env:
      COUCHBASE_INTEGRATION_TESTS: '1'
      COUCHBASE_CONNECTION_STRING: couchbase://localhost
      COUCHBASE_USERNAME: Administrator
      COUCHBASE_PASSWORD: password
      COUCHBASE_BUCKET: strands_memory
      COUCHBASE_SCOPE: _default
      COUCHBASE_COLLECTION: _default
      COUCHBASE_VECTOR_BACKEND: hyperscale
      COUCHBASE_DISTANCE_METRIC: L2_SQUARED
      # The live tests and examples/smoke-test.ts share the 3-dimension index from the setup script.
      EMBEDDING_DIMENSIONS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Initialize Couchbase, bucket, seed documents and vector index
        run: bash ../scripts/setup-live-couchbase.sh
      - run: npm ci
      - name: examples/setup.ts accepts the existing index
        run: cp .env.example .env && npm run example:setup
      - run: npm run test:live
      - name: Run examples/smoke-test.ts from the packed tarball
        run: npm run smoke:package
        env:
          COUCHBASE_NAMESPACE: smoke-${{ github.run_id }}
