[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-couchbase"
dynamic = ["version"]
description = "Couchbase Hyperscale Vector Search MemoryStore extension for Strands Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Couchbase Ecosystem", email = "devadvocacy@couchbase.com"}]
keywords = ["strands", "agents", "couchbase", "vector-search", "memory-store"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "couchbase>=4.6.3,<5.0.0",
  "strands-agents>=1.57.0",
  "typing-extensions>=4.10.0",
]

[project.urls]
Homepage = "https://github.com/Couchbase-Ecosystem/couchbase-strands-agents"
Documentation = "https://github.com/Couchbase-Ecosystem/couchbase-strands-agents#readme"
Repository = "https://github.com/Couchbase-Ecosystem/couchbase-strands-agents"
Issues = "https://github.com/Couchbase-Ecosystem/couchbase-strands-agents/issues"

[project.optional-dependencies]
dev = [
  "build>=1.6.1,<2.0.0",
  "hatch>=1.18.1,<2.0.0",
  "mypy>=2.3.1,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "ruff>=0.16.8,<1.0.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = ".."
tag_regex = "^python-v(?P<version>.+)$"
# Only look at python-v* tags. Without this, git describe can return a typescript-v* tag, which tag_regex
# can't parse, and every Python build fails.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "python-v*"]
relative_to = "pyproject.toml"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_couchbase"]

[tool.hatch.envs.default]
dependencies = [
  "build>=1.6.1,<2.0.0",
  "mypy>=2.3.1,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "ruff>=0.16.8,<1.0.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = "ruff check src tests examples"
format = "ruff format src tests examples"
typecheck = "mypy src"
build = "python -m build"
prepare = ["format", "lint", "typecheck", "test", "build"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["integration: requires a live Couchbase cluster"]
